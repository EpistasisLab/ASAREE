# ASAREE's own compose file. `include:` pulls Motoro's own compose.yml
# in as part of this project, so a single `docker compose up` here also
# brings up motoro-postgres/motoro-redis/motoro-migrate --
# no separate `docker compose up -d` in the Motoro repo needed first.
# Mirrors Motoro's own migrate-then-serve shape (see
# Motoro/compose.yml and docker/Dockerfile.migrate).
#
# MOTORO_DIR points at a checkout of Motoro; defaults to a
# sibling directory (../Motoro relative to this file), matching how
# it's actually checked out today. Override it (env var or .env) if yours
# lives somewhere else. Don't also run `docker compose up` directly inside
# that checkout while this is up -- same container_names/ports, so the two
# would collide.
#
# Motoro is a pinned git dependency (see pyproject.toml). While that repo is
# private, building needs a GitHub token with read access to it, passed as a
# build secret -- GH_TOKEN=$(gh auth token) works if you're logged in via the
# gh CLI:
#
#   GH_TOKEN=$(gh auth token) docker compose up -d --build
#
# Only `--build` needs it; plain `docker compose up -d` against existing
# images does not. Once Motoro is public the prefix becomes unnecessary (an
# empty secret still fetches a public repo fine -- see Dockerfile), but it
# stays harmless, so this remains the one command that always works.

include:
  - path: ${MOTORO_DIR:-../Motoro}/compose.yml

services:
  asaree-migrate:
    build:
      context: .
      secrets:
        - gh_token
    container_name: asaree-migrate
    depends_on:
      motoro-postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Internal container network, not the host-mapped ports in .env
      # (which are wrong from inside a container on this network).
      ASAREE_DATABASE_URL: postgresql+asyncpg://agentic:agentic@motoro-postgres:5432/motoro
      ASAREE_PRODUCT_DATABASE_URL: postgresql+asyncpg://agentic:agentic@motoro-postgres:5432/asaree
    entrypoint: ["python", "-m", "asaree.migrations"]
    command: ["upgrade"]
    restart: "no"

  asaree-app:
    build:
      context: .
      secrets:
        - gh_token
    container_name: asaree-app
    depends_on:
      asaree-migrate:
        condition: service_completed_successfully
      motoro-redis:
        condition: service_healthy
    env_file: .env
    environment:
      ASAREE_DATABASE_URL: postgresql+asyncpg://agentic:agentic@motoro-postgres:5432/motoro
      ASAREE_PRODUCT_DATABASE_URL: postgresql+asyncpg://agentic:agentic@motoro-postgres:5432/asaree
      ASAREE_REDIS_URL: redis://motoro-redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # Persists dataset workspaces and the OKF bundle across restarts —
      # otherwise both live inside the container's own ephemeral filesystem.
      - ./data:/app/data
      # register_servers.py (run on the host, from a use-case repo) persists
      # an absolute HOST path in each domain server's `command` column --
      # `uv run --directory <host path> ...`. Mounted at the identical path
      # so that command resolves inside the container too, without needing
      # to re-register anything. Adjust the host side if your checkout of
      # asaree-spinal-use-case lives somewhere else.
      #
      # Read-write, not read-only: uv run --directory manages that
      # directory's own .venv (creating/rebuilding it as needed), and a host-
      # built .venv doesn't match the container's interpreter, so uv needs to
      # recreate it here on first run.
      - /home/moranj3/dev/asaree-spinal-use-case/mcp-servers:/home/moranj3/dev/asaree-spinal-use-case/mcp-servers
    restart: unless-stopped

  # Same built image as asaree-app, running the arq worker instead of
  # uvicorn -- see Dockerfile's CMD, overridden here via `command:`. Deployed
  # alongside the still-inline POST /runs for now (asaree.api.runs hasn't
  # been switched to enqueue yet); this service exists so the worker path can
  # be smoke-tested against real Redis/Postgres before that switch lands.
  asaree-worker:
    build:
      context: .
      secrets:
        - gh_token
    container_name: asaree-worker
    depends_on:
      asaree-migrate:
        condition: service_completed_successfully
      motoro-redis:
        condition: service_healthy
    env_file: .env
    environment:
      ASAREE_DATABASE_URL: postgresql+asyncpg://agentic:agentic@motoro-postgres:5432/motoro
      ASAREE_PRODUCT_DATABASE_URL: postgresql+asyncpg://agentic:agentic@motoro-postgres:5432/asaree
      ASAREE_REDIS_URL: redis://motoro-redis:6379/0
    command: ["arq", "asaree.worker.settings.WorkerSettings"]
    volumes:
      # Same two mounts as asaree-app, and for the same reasons: dataset
      # workspaces/OKF bundle need to survive a restart, and hydrate_registry
      # (asaree.worker.settings.on_startup) reconnects domain MCP servers by
      # replaying their persisted `command`, which is a HOST path under this
      # use-case repo -- the worker is now the process that actually spawns
      # those subprocesses, so it needs the identical mount, at the identical
      # path, that asaree-app has.
      - ./data:/app/data
      - /home/moranj3/dev/asaree-spinal-use-case/mcp-servers:/home/moranj3/dev/asaree-spinal-use-case/mcp-servers
    restart: unless-stopped

  asaree-frontend:
    build:
      context: ./frontend
    container_name: asaree-frontend
    depends_on:
      - asaree-app
    environment:
      # Service name on the compose network, not 127.0.0.1 (see
      # frontend/vite.config.ts) — 127.0.0.1 inside this container is
      # itself, not asaree-app.
      VITE_API_PROXY_TARGET: http://asaree-app:8000
    ports:
      - "5173:5173"
    volumes:
      # Bind-mount for hot reload; node_modules stays the image's own
      # (installed for Linux/the container's arch) rather than whatever's
      # in the host checkout.
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

secrets:
  gh_token:
    environment: GH_TOKEN
