# ASAREE's own compose file — separate from agentic-core's, joining its
# network as an external dependency rather than merging into it. Mirrors
# agentic-core's own migrate-then-serve shape (see agentic-core/compose.yml
# and docker/Dockerfile.migrate).
#
# Requires agentic-core's stack already running (`docker compose up -d` in
# the agentic-core repo) — this only joins its network by name, it doesn't
# start Postgres/Redis itself. ASAREE has no backing services of its own.
#
# agentic-core is a private git dependency (see pyproject.toml); building
# needs a GitHub token with read access to it, passed as a build secret --
# GH_TOKEN=$(gh auth token) works if you're logged in via the gh CLI.
#
#   GH_TOKEN=$(gh auth token) docker compose up -d --build

services:
  asaree-migrate:
    build:
      context: .
      secrets:
        - gh_token
    container_name: asaree-migrate
    env_file: .env
    environment:
      # Internal container network, not the host-mapped ports in .env
      # (which are wrong from inside a container on this network).
      ASAREE_DATABASE_URL: postgresql+asyncpg://agentic:agentic@agentic-core-postgres:5432/agentic_core
      ASAREE_PRODUCT_DATABASE_URL: postgresql+asyncpg://agentic:agentic@agentic-core-postgres:5432/asaree
    entrypoint: ["python", "-m", "asaree.migrations"]
    command: ["upgrade"]
    networks:
      - agentic-core_default
    restart: "no"

  asaree-app:
    build:
      context: .
      secrets:
        - gh_token
    container_name: asaree-app
    depends_on:
      asaree-migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      ASAREE_DATABASE_URL: postgresql+asyncpg://agentic:agentic@agentic-core-postgres:5432/agentic_core
      ASAREE_PRODUCT_DATABASE_URL: postgresql+asyncpg://agentic:agentic@agentic-core-postgres:5432/asaree
      ASAREE_REDIS_URL: redis://agentic-core-redis:6379/0
      # Domain-specific MCP servers (e.g. asaree-spinal-use-case/mcp-servers,
      # mounted below) are spawned via `uv run --directory ...` *at runtime*,
      # whenever one gets registered -- not at image build time, so the
      # build secret above doesn't cover this. Their own dependencies can
      # include other private repos (asaree-workspace-core, fetched from
      # this same ASAREE repo) that uv needs to fetch fresh inside the
      # running container. Same one-shot-git-config mechanism as the
      # Dockerfile's build step, just live for the container's whole
      # lifetime instead of one RUN -- unlike the build secret, this makes
      # the token visible via `docker inspect`/`docker exec env` on this
      # container. Acceptable for a dev/research sandbox using your own
      # `gh auth token`; reconsider before running this anywhere less trusted.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "url.https://oauth2:${GH_TOKEN}@github.com/.insteadOf"
      GIT_CONFIG_VALUE_0: "https://github.com/"
    ports:
      - "8000:8000"
    volumes:
      # Persists dataset workspaces and the OKF bundle across restarts —
      # otherwise both live inside the container's own ephemeral filesystem.
      - ./data:/app/data
      # register_servers.py (run on the host, from a use-case repo) persists
      # an absolute HOST path in each domain server's `command` column --
      # `uv run --directory <host path> ...`. Mounted at the identical path
      # so that command resolves inside the container too, without needing
      # to re-register anything. Adjust the host side if your checkout of
      # asaree-spinal-use-case lives somewhere else.
      #
      # Read-write, not read-only: uv run --directory manages that
      # directory's own .venv (creating/rebuilding it as needed), and a host-
      # built .venv doesn't match the container's interpreter, so uv needs to
      # recreate it here on first run.
      - /home/moranj3/dev/asaree-spinal-use-case/mcp-servers:/home/moranj3/dev/asaree-spinal-use-case/mcp-servers
    networks:
      - agentic-core_default
    restart: unless-stopped

networks:
  # Created by agentic-core's own compose.yml (project name "agentic-core" ->
  # implicit network "agentic-core_default"). Not owned or created here.
  agentic-core_default:
    external: true

secrets:
  gh_token:
    environment: GH_TOKEN
