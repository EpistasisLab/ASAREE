[project]
name = "asaree-sklearn-core"
version = "0.1.0"
description = "Shared, MCP-free domain computation for the asaree-sklearn server family — pure sklearn/xgboost/statsmodels computation only. The on-disk versioned workspace lives in asaree-workspace-core."
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.4.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "imbalanced-learn>=0.12.0",
    "pyarrow>=14.0.0",
    "xgboost>=2.0.0",
    "optuna>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asaree_sklearn_core"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0.0",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
