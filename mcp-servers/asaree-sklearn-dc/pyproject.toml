[project]
name = "asaree-sklearn-dc"
version = "0.1.0"
description = "ASAREE data-cleaning MCP server (SF-DC) — thin FastMCP wrapper over asaree-sklearn-core: domain/type fixing, imputation, outlier detection. Reads/writes its own scratch-directory train/test parquet via ambient _meta; no dependency on asaree-workspace-core. See milestone #112 / issue #1457."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "asaree-sklearn-core",
]

[tool.uv.sources]
asaree-sklearn-core = { path = "../asaree-sklearn-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asaree_sklearn_dc"]
