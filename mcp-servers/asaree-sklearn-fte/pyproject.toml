[project]
name = "asaree-sklearn-fte"
version = "0.1.0"
description = "ASAREE feature-engineering MCP server (SF-FTE) — thin FastMCP wrapper over asaree-sklearn-core: replayable feature recipes and preprocessing-pipeline fits. Reads/writes its own scratch-directory train/test parquet via ambient _meta; no dependency on asaree-workspace-core. See milestone #112 / issue #1457."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "asaree-sklearn-core",
]

[tool.uv.sources]
asaree-sklearn-core = { path = "../asaree-sklearn-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asaree_sklearn_fte"]
