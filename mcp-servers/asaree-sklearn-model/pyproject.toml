[project]
name = "asaree-sklearn-model"
version = "0.1.0"
description = "ASAREE modeling MCP server — thin FastMCP wrapper over asaree-sklearn-core exposing run_model_script: fit-in-script / score-server-side on the workspace HEAD (read directly from state.json, no asaree-workspace-core dependency), so a training script can never see the held-out test split. See milestone #112 / issue #1457."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "asaree-sklearn-core",
]

[tool.uv.sources]
asaree-sklearn-core = { path = "../asaree-sklearn-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asaree_sklearn_model"]
