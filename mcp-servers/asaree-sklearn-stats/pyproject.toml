[project]
name = "asaree-sklearn-stats"
version = "0.1.0"
description = "ASAREE statistical-analysis MCP server — a thin FastMCP wrapper over asaree-sklearn-core (Friedman, pairwise post-hoc, experiment summary, ART ANOVA). See milestone #112 / issue #1457."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "asaree-sklearn-core",
]

[tool.uv.sources]
asaree-sklearn-core = { path = "../asaree-sklearn-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asaree_sklearn_stats"]
