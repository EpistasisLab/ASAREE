[project]
name = "scikit-learn-mcp"
version = "0.1.0"
description = "A standalone scikit-learn/XGBoost MCP server: script-execution modeling tools (XGBoost, linear regression) that fit on a training split and score server-side on a held-out test split. Reads its dataset from a path/URI argument, so it has no dependency on ASAREE or any particular workspace layout and runs against any MCP client."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scikit_learn_mcp"]
