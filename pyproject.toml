[project]
name = "asaree"
# Derived from the git tag by hatch-vcs (see [tool.hatch.version]), same as
# Motoro. Nothing to edit when cutting a release: tag it and the version
# follows. Between tags this reads as a dev version (0.2.1.dev4+g<sha>), which
# is the point -- it names the exact build rather than whatever number was last
# typed here.
dynamic = ["version"]
description = "ASAREE — the product built on Motoro."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Pinned to a tagged release of Motoro (see [tool.uv.sources] below —
    # Motoro's own README documents its semver-tag convention), bumped
    # only as a deliberate, reviewed action — never left floating to that
    # repo's main. See project_plan/core_asaree_use_case.md in the ARES repo.
    "motoro",
    # The on-disk versioned dataset workspace (see [tool.uv.sources] below) —
    # its own package rather than a module of `asaree`, because the domain MCP
    # servers under mcp-servers/ depend on the same on-disk format without
    # depending on ASAREE itself, the same way ASAREE depends on Motoro.
    "asaree-workspace-core",
    # The bundled domain MCP servers (mcp-servers/, path sources below), and
    # the MCP-free computation library they all wrap. Dependencies of the app
    # itself, not a separate checkout, because `app.py`'s lifespan spawns them
    # as subprocesses out of THIS venv — installing them here is what lets
    # their stored `command` be a plain `python -m asaree_sklearn_dc` with no
    # host path in it, so they auto-register on a fresh deployment exactly
    # like asaree-workspace and motoro-okf do. They used to live in
    # asaree-spinal-use-case and be registered by hand (a `uv run --directory
    # <host path>` command that only resolved on the machine that wrote it);
    # nothing about them is spinal, so they belong with the product.
    "asaree-sklearn-core",
    "asaree-sklearn-dc",
    "asaree-sklearn-eda",
    "asaree-sklearn-fs",
    "asaree-sklearn-fte",
    "asaree-sklearn-model",
    "asaree-sklearn-stats",
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.30.0",
    "alembic>=1.18.4",
    # Password hashing, JWT session tokens, and email validation for the user
    # model. Deliberately not Motoro's concern (auth is explicitly a
    # product decision — see CoreSettings' docstring) so they're declared
    # here, not inherited.
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
    "email-validator>=2.2.0",
    # ASAREE's OWN Redis connection (login/registration rate limiting, the
    # JWT deny list) — separate from Motoro's internal use of the same
    # ASAREE_REDIS_URL for working memory; core owns that connection
    # privately, so this product-level use needs its own client.
    "redis>=5.2.0,<6",
    # Dataset registration's inline train/test split — the same
    # GroupShuffleSplit/stratified split_runner.py already used, minus the
    # subprocess indirection (no worker in ASAREE for v1).
    "pandas>=2.2.0",
    "scikit-learn>=1.6.0",
    "pyarrow>=18.0.0",
    # Freedman-Lane permutation, BCa bootstrap, Holm correction, Levene's
    # test — the spinal_surgery use case's factorial-analysis methodology
    # (services.factorial_analysis).
    "scipy>=1.14.0",
    # The run worker (asaree.worker) — executes runs enqueued by POST /runs
    # instead of inline, on the same Redis Motoro and the rate-limiter
    # already depend on. Motoro's own pyproject.toml earmarks this as
    # "arrives with the worker slice" — this is that slice, on ASAREE's side.
    "arq>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
    "httpx>=0.28.1",
    "pandas-stubs>=3.0.5.260730",
]

[tool.uv.sources]
motoro = { git = "https://github.com/EpistasisLab/motoro.git", tag = "v0.2.1" }
asaree-workspace-core = { path = "workspace-core", editable = true }
# Every mcp-servers/ package is declared here, including asaree-sklearn-core
# (which the six servers each depend on): uv resolves `tool.uv.sources` from
# the root project only, so a sub-package's own `{ path = "../asaree-sklearn-
# core" }` entry is NOT consulted from here — this root declaration is what
# actually satisfies that shared dependency.
asaree-sklearn-core = { path = "mcp-servers/asaree-sklearn-core", editable = true }
asaree-sklearn-dc = { path = "mcp-servers/asaree-sklearn-dc", editable = true }
asaree-sklearn-eda = { path = "mcp-servers/asaree-sklearn-eda", editable = true }
asaree-sklearn-fs = { path = "mcp-servers/asaree-sklearn-fs", editable = true }
asaree-sklearn-fte = { path = "mcp-servers/asaree-sklearn-fte", editable = true }
asaree-sklearn-model = { path = "mcp-servers/asaree-sklearn-model", editable = true }
asaree-sklearn-stats = { path = "mcp-servers/asaree-sklearn-stats", editable = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# Generated at build time, gitignored, and shipped in the wheel so an installed
# app can report its own version without the git metadata it was built from.
# NOTE: this is why the Dockerfile bind-mounts .git into the final `uv sync` --
# that step builds this project, and hatch-vcs has nothing to read without it.
[tool.hatch.build.hooks.vcs]
version-file = "src/asaree/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/asaree"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Standalone package trees and scripts, not part of the `asaree` package: each
# is its own distribution with its own conventions, so this config isn't
# theirs to impose. Mostly that means scikit-learn's own capitalization (X for
# a feature matrix, y for a target) tripping N803/N806 on nearly every
# function in mcp-servers/ -- the same exception per-file-ignores already
# grants src/asaree/mcp_servers/workspace_server.py, for the same reason.
# Without this, `ruff check .` reports ~150 findings that `ruff check src/`
# (the command that actually gates this repo) never saw.
extend-exclude = ["mcp-servers", "workspace-core", "publications"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated. Reformatting them makes a diff against
# what autogenerate produced unreadable, which is the one thing a migration
# should be. Matches Motoro's own convention.
"src/asaree/migrations/versions/*.py" = ["E501", "I001", "W291"]
# X_train/X_test are scikit-learn's own capitalization convention (X = a
# feature matrix, y = a target vector) -- renaming to x_train would read as
# wrong to anyone coming from that ecosystem, not more correct.
"src/asaree/mcp_servers/workspace_server.py" = ["N806"]

[tool.ruff.lint.isort]
known-first-party = ["asaree"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
