[project]
name = "asaree"
version = "0.0.1"
description = "ASAREE — the product built on agentic-core."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Pinned to a real commit on agentic-core's main (see [tool.uv.sources]
    # below), bumped only as a deliberate, reviewed action — never left
    # floating to that repo's main. See project_plan/core_asaree_use_case.md
    # in the ARES repo.
    "agentic-core",
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.30.0",
    "alembic>=1.18.4",
    # Password hashing and email validation for the user model. Deliberately
    # not agentic-core's concern (auth is explicitly a product decision — see
    # CoreSettings' docstring) so they're declared here, not inherited.
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    # Dataset registration's inline train/test split — the same
    # GroupShuffleSplit/stratified split_runner.py already used, minus the
    # subprocess indirection (no worker in ASAREE for v1).
    "pandas>=2.2.0",
    "scikit-learn>=1.6.0",
    "pyarrow>=18.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
    "httpx>=0.28.1",
    "pandas-stubs>=3.0.5.260730",
]

[tool.uv.sources]
agentic-core = { git = "https://github.com/jay-m-dev/agentic-core.git", rev = "13379bc93d27146262dd8207b80dc70c85255217" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asaree"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated. Reformatting them makes a diff against
# what autogenerate produced unreadable, which is the one thing a migration
# should be. Matches agentic-core's own convention.
"src/asaree/migrations/versions/*.py" = ["E501", "I001", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["asaree"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
