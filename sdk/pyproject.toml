[project]
name = "asaree-client"
# Derived from the same git tag as the app it talks to (raw-options.root = ".."
# points hatch-vcs at the repo root from this subdirectory). That's deliberate:
# this SDK ships in the same repo and is versioned with it, and __init__.py's
# __version__ -- which _transport sends as the User-Agent on every request --
# now names the exact build rather than a number someone forgot to bump.
dynamic = ["version"]
description = "Trimmed synchronous SDK for ASAREE — just enough to drive a factorial experiment from a notebook."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# The .git this reads lives one level up, at the repo root.
raw-options = { root = ".." }

[tool.hatch.build.hooks.vcs]
version-file = "src/asaree_client/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/asaree_client"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["asaree_client"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
