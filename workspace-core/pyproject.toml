[project]
name = "asaree-workspace-core"
version = "0.1.0"
description = "The on-disk versioned dataset workspace ASAREE owns — no ML-domain logic. Split out of ares-sklearn-core so domain-specific MCP servers can depend on the same workspace format without owning it."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asaree_workspace_core"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
